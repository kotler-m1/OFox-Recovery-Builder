name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '16.0'
        type: choice
        options:
        - '16.0'
        - '14.1'
        - '12.1'
      DEVICE_TREE:
        description: 'OrangeFox Device Tree'
        required: true
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: ''
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: ''
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: ''
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - vendorboot
        - recovery
        - boot

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate Inputs
      run: |
        fail=0
        [ -z "${{ inputs.DEVICE_TREE }}" ]        && { echo "::error::DEVICE_TREE is required."; fail=1; }
        [ -z "${{ inputs.DEVICE_TREE_BRANCH }}" ] && { echo "::error::DEVICE_TREE_BRANCH is required."; fail=1; }
        [ -z "${{ inputs.DEVICE_PATH }}" ]        && { echo "::error::DEVICE_PATH is required."; fail=1; }
        [ -z "${{ inputs.DEVICE_NAME }}" ]        && { echo "::error::DEVICE_NAME is required."; fail=1; }
        if [ "$fail" -ne 0 ]; then exit 1; fi

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Increase vm.swappiness
      run: |
        sudo sysctl vm.swappiness=120
        echo "vm.swappiness is now: $(cat /proc/sys/vm/swappiness)"

    # --- JDK selection: 21 for 16.0, 17 for 14.1/12.1 ---
    - name: Install JDK 21 (fox_16.0)
      if: inputs.MANIFEST_BRANCH == '16.0'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 21

    - name: Install JDK 17 (fox_14.1 / fox_12.1)
      if: inputs.MANIFEST_BRANCH != '16.0'
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 17

    - name: Verify Java
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"

    # --- This is what installs `repo` and all build deps ---
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=${{ inputs.DEVICE_NAME }}
        export LC_ALL=C
        set -e

        # Branch-specific lunch target
        if [ "${{ inputs.MANIFEST_BRANCH }}" = "16.0" ]; then
          LUNCH_TARGET="twrp_${{ inputs.DEVICE_NAME }}-bp2a-eng"
        elif [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
          LUNCH_TARGET="twrp_${{ inputs.DEVICE_NAME }}-ap2a-eng"
        else
          # 12.1 and older use the plain "-eng" target
          LUNCH_TARGET="twrp_${{ inputs.DEVICE_NAME }}-eng"
        fi

        echo "Using lunch target: $LUNCH_TARGET"
        lunch $LUNCH_TARGET
        make clean
        mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox ${{ inputs.MANIFEST_BRANCH }} for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - Unofficial
          Build: fox_${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}.img
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
